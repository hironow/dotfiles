[project]
name = "dotfiles"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

# Submodules and external dependencies are exempt from local lint/format
# (per project structure rules in ROOT_AGENTS.md / CLAUDE.md).
# Sources of truth: `git config --file .gitmodules --get-regexp path`.
[tool.ruff]
extend-exclude = [
    # semgrep rule test fixtures intentionally contain violations (print/eval/
    # exec/...) so `semgrep --test` can verify the rules fire; never ruff them.
    ".semgrep",
    "emulator",
    "gcloud",
    "guardrails",
    "knowledge-work-plugins",
    "payments",
    "protocols",
    # `submodules/` holds upstream checkouts pinned as gitlinks (e.g. google/ax,
    # read while designing against its runner contract). Upstream Python there
    # is not ours to format -- same exemption as every other vendored dir above.
    "submodules",
    "telemetry",
    # templates/agent-baseline/.semgrep/tests/* are intentional-violation
    # fixtures (os.path.join / MagicMock) for the scaffold's own semgrep rules.
    # Only those fixtures: tools/ and the rest of templates/ are our own code.
    "templates/agent-baseline/.semgrep",
    # `private/certificates/` is created by Let's Encrypt with mode 0700.
    # Inside a bind-mounted dev container ruff cannot traverse it and aborts.
    # Nothing under private/ is Python source anyway.
    "private",
]

[tool.ruff.lint]
# On top of ruff's default rule set (413 rules since ruff 0.16, listed at
# https://docs.astral.sh/ruff/default-rules/). W605 turns invalid escape
# sequences (e.g. "\A" in a Windows path inside a non-raw string) into a
# gate failure. CPython 3.12+ only emits a SyntaxWarning for them (a future
# release makes it a SyntaxError), so they ride through `just ci` as pytest
# warning noise today; 7 such sites had accumulated under tests/unit/.
# PTH (flake8-use-pathlib) keeps filesystem code on pathlib: os.path string
# joins and bare open() hide the Windows separator and encoding bugs this
# repo keeps hitting on native Windows hosts.
extend-select = ["W605", "PTH"]

[tool.pytest.ini_options]
markers = [
    "install: tests for install.sh flows",
    "validate: PATH validation tests",
    "versions: software version check tests",
    "deploy: deploy and idempotency tests",
    "check: basic just check commands",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# ruff + ty only: `uv run --frozen --only-group lint ruff` (just fmt/lint/check,
# format-after-edit). ty uses `--group lint` so it still sees project imports.
lint = [
    # lock pin; tests/unit/test_ruff_ty_pins.py keeps this equal across projects
    "ruff==0.16.9",
    # pre-1.0: pinned exactly, bumped deliberately (ADR 0044)
    "ty==0.0.84",
]

[tool.uv]
# Same supply-chain settings as every uv project here (emulator/pyproject.toml
# has the full rationale): 7-day release quarantine, resolution through the
# malware-scanning flatt PyPI mirror (ADR 0028). ruff/ty = false so an exact
# pin can move without waiting out the window (docs/agents/python-tooling.md).
exclude-newer = "7 days"
exclude-newer-package = { ruff = false, ty = false }

[[tool.uv.index]]
name = "flatt"
url = "https://pypi.flatt.tech/simple/"
default = true

# ty (ADR 0044): the root tooling in scripts/ and its tests. extra-paths lets
# the tests' bare `from sync_agents import ...` resolve against scripts/.
# Warnings fail the gate (severity only; ty has no strict mode).
[tool.ty.src]
include = ["scripts", "tests"]

[tool.ty.environment]
extra-paths = ["scripts"]

[tool.ty.terminal]
error-on-warning = true

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[tool.uv.sources]
ty = { index = "pypi" }
