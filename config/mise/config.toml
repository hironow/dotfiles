# Global mise config for hironow's machines. Symlinked to
# ~/.config/mise/config.toml by `just deploy`.
#
# Project-pinned tools live in this file (deployed to ~/.config/mise/config.toml
# by `just deploy`; baked to /etc/mise/config.toml in the devcontainer image).
# The former repo-root mise.toml was removed 2026-08-05. See ADR 0006 for
# the version-pinning strategy.
# This file holds user-level tool defaults, security settings, and backend
# tweaks that follow CLAUDE.md global rules.

[tools]
bun = "latest"
go = "latest"
node = "lts"
just = "latest"
rust = "1.98.0"
# opentofu — terraform-compatible IaC. Required by `just test-iac`
# so `mise x -- tofu` resolves from the non-mise-activated bash
# sub-shell that `just` spawns under ADR 0023 (mise-activate-only,
# no shims PATH). Pinned for repeatable IaC test runs across machines.
opentofu = "1.12.6"
# Python toolchain = the astral trio, always: uv (packages/runner), ruff
# (lint + format), ty (type checking; https://github.com/astral-sh/ty).
# mypy / pyright are retired (2026-09-08) — do not reintroduce them. Declared
# here so all three resolve globally on every host (ADR 0023 activate-only);
# per-repo gates additionally pin them as uv dev dependencies. ruff and ty
# ship via the aqua backend (astral-sh/ruff, astral-sh/ty) and are the ONLY
# copies on this machine (the Homebrew ruff was uninstalled 2026-09-08 so a
# stale-PATH shell cannot pick a different version). Both are PINNED
# (ADR 0006): ruff to the exact version the dotfiles justfile gate runs
# (its `uvx ruff@<ver>` pin -- `just bump-tool ruff <ver>` moves both), so a
# hand-run `ruff check` in a mise-activated
# shell reports what `just check` reports (a newer ruff widens the default
# rules: 0.16 showed 88 findings the gate does not); ty because it is still
# 0.0.x and a "latest" pre-release could change diagnostics under a
# mandatory gate; it equals the ty==<ver> dev pin of this repo's uv projects
# (tests/unit/test_ruff_ty_pins.py keeps all three declarations in step;
# a newer ty enters the uv locks only once it clears the 7-day quarantine,
# so bump here at the same time). These global copies serve interactive use only: per-repo
# gates and the Claude format-after-edit hook run `uv run [--frozen] ruff`,
# i.e. that repo's own dev-dependency pin, never these. Bump both together
# with the justfile pin.
uv = "latest"
ruff = "0.15.22"
ty = "0.0.77"
kotlin = "latest"
java = "latest"
gradle = "latest"
python = "latest"
vp = "latest"
markdownlint-cli2 = "latest"
# prek — pre-commit runner. Declared here so it resolves on the Mac
# host outside the dotfiles dir (ADR 0023 is activate-only with no
# shims PATH, so a repo-only tool is invisible elsewhere).
prek = "latest"
# portless (local-dev HTTPS proxy). De-orphaned from the retired
# pnpm-global subsystem (ADR 0017): declare it here so `mise ls` shows
# a config source instead of an untracked orphan.
"npm:portless" = "0.15.6"
# eza — modern ls replacement aliased unconditionally-now-guarded in
# .zshrc (`alias ls='eza ...'`). Declared here so `mise activate` puts
# it on PATH for every dir; without a config source the installed
# binary stays an orphan and `ls` falls back to system ls. Pinned (not
# "latest") for cross-machine reproducibility (ADR 0006).
eza = "0.23.5"
# shellcheck — `just check` runs it via `mise x -- shellcheck`, which
# resolves ONLY config-declared tools; an installed-but-undeclared copy is
# an orphan and `mise x` fails with "couldn't exec process" (seen live
# 2026-08-17 on WSL, where brew never provides it). Pinned (not "latest")
# for cross-machine reproducibility (ADR 0006).
shellcheck = "0.11.0"
# starship (prompt) + sheldon (zsh plugin manager). Initialized in .zshrc
# AFTER `mise activate` (see EOF). Declared here so mise puts them on PATH
# for every dir; without a config source they stay orphan installs and the
# `_cmd_exists` guards in .zshrc skip prompt + plugins entirely. On a Mac
# Homebrew also provides them, but WSL has no brew, so mise is the only
# provider there. Pinned (not "latest") for cross-machine reproducibility.
# sheldon ships via the aqua backend (rossmacarthur/sheldon); starship is a mise core tool.
#
# sheldon is OS-gated to linux/macos: this config is shared (symlinked) across
# Mac / Windows / WSL, and the aqua sheldon build has no windows/amd64 asset, so
# an ungated entry makes `mise install` / `mise exec` hard-fail on Windows
# (incl. WSL git hooks that pick up the Windows mise on the /mnt/c PATH). sheldon
# is a zsh plugin manager — irrelevant on Windows anyway.
starship = "1.26.0"
"aqua:rossmacarthur/sheldon" = { version = "0.8.5", os = ["linux", "macos"] }
# fzf — fuzzy finder. Its Ctrl-R / completion init (`fzf --zsh`) lives in
# .zshrc AFTER `mise activate` for the same reason as the prompt tools above.
# Declared here so WSL (no Homebrew) gets it; on a Mac brew also provides it.
# Pinned for cross-machine reproducibility. (opentofu, the other
# WSL-orphaned alias `t`, is already declared earlier in this file.)
fzf = "0.74.3"

# AI agent CLIs. Declared at "latest" so they resolve globally on every
# host (ADR 0023 activate-only: a repo-only tool is only on PATH inside
# the dotfiles dir). These track the TRUE newest release — the global 7d
# minimum_release_age quarantine was removed 2026-09-03 so mise-declared
# tools update immediately (see [settings] below). Authenticate on first
# use (`codex login`, `claude /login`, `copilot auth`, `pi auth`;
# antigravity authenticates on first run).
"npm:@openai/codex" = "latest"
# claude-code hardlinks its native binary in a postinstall (install.cjs).
# Under the bun backend (settings.npm below) that script runs because the
# package is on bun's default-trusted dependencies list — no per-tool config
# needed. Do NOT re-add `npm_args = "--ignore-scripts=false"` here: mise
# only reads npm_args under the npm backend (bun reads bun_args), so it was
# inert, and its comment wrongly credited it for the working binary
# (ADR 0040 corrects ADR 0036 on this point).
"npm:@anthropic-ai/claude-code" = "latest"
"npm:@github/copilot" = "latest"
# trust_policy_excludes: the 2026-08-14 @smithy/* batch (core@3.33.0,
# node-http-handler@4.11.0) was published by aws-sdk-bot (a listed maintainer)
# without provenance attestations, while the prior releases had them — aube's
# no-downgrade policy (mise >= 2026.8.6) blocks the install. Verified against
# npmjs.org 2026-08-15 (benign publish outside the trusted workflow, not
# tampering). Drop once provenance-attested @smithy releases ship.
"npm:@earendil-works/pi-coding-agent" = { version = "latest", trust_policy_excludes = ["@smithy/core@3.33.0", "@smithy/node-http-handler@4.11.0"] }

# antigravity (Google's agentic CLI) — replaces gemini-cli (per Google's
# "Transitioning Gemini CLI to Antigravity CLI"). GitHub-release binary
# via mise's github backend; exe is `antigravity`. SUPPLY-CHAIN NOTE: no
# SLSA/Sigstore attestation or SHA sidecar is published for these releases
# (gh attestation API 404), so there is no enforced provenance gate.
# Pinned to the true newest release (first release was 2026-06-01);
# bump on `just update-all` rounds together with the other pins here.
"github:google-antigravity/antigravity-cli" = { version = "latest", exe = "antigravity" }

# Cloud-service dev CLIs (npm-distributed). Declared "latest" like the
# AI CLIs above — tracks the true newest release. Concrete pins for the
# devcontainer image live in
# .devcontainer/features/dotfiles-tools/install.sh. Explicit `npm:`
# backend avoids registry-alias ambiguity.
#   cf -> Cloudflare CLI, resend-cli -> Resend, @stripe/cli -> Stripe,
#   @dataform/cli -> Dataform (BigQuery ELT)
"npm:cf" = "latest"
"npm:resend-cli" = "latest"
"npm:@stripe/cli" = "latest"
"npm:@dataform/cli" = "latest"

[settings]
# Disable asdf-style .python-version / .nvmrc auto-detection so only
# mise config files / .tool-versions drive tool resolution.
idiomatic_version_file_enable_tools = []
# Block surprise installs when invoking a missing command. `mise install`
# must be explicit.
not_found_auto_install = false
# `mise use <tool>` (without a version) records the currently pinned
# version instead of "latest", keeping the config reproducible
# (ADR 0006 pinned-versions philosophy).
pin = true
# Supply-chain quarantine for mise-managed tools was REMOVED 2026-09-03:
# the user toolset declared in this file now tracks the true newest
# release on `mise up` (the 7d wait cost current models/protocol fixes
# in the LLM CLIs and was friction everywhere else). Explicit "0" is
# required — removing the key entirely would fall back to mise's
# built-in 24h default quarantine. Dependency installs remain
# quarantined via the npmrc min_release_age / uv exclude-newer guards
# written by `just harden-env` (ADR 0028). To restore temporarily:
# minimum_release_age = "7d"
minimum_release_age = "0"

[settings.upgrade]
# Do not queue the outgoing version for deletion on `mise up` (mise default:
# auto_prune = true, prune_after = "24h"). The deferred prune fires from the
# next activation, i.e. from every shell startup, and on Windows a directory
# whose executable is still running cannot be removed - so a long-lived
# process on the old version (a Claude Code session, a bun-hosted tenant)
# turns every new terminal into
#   WARN failed to prune npm:@anthropic-ai/claude-code@2.1.258: ...
# for as long as it lives (lived 2026-09-08). Old versions are harmless
# directories; reclaim them deliberately with `just disk-gc` (`mise prune`)
# when nothing holds them. Same behaviour on macOS / Linux for consistency.
auto_prune = false

[settings.github]
# Version lookups for github: backends hit the unauthenticated 60 req/h
# API limit and spam rate-limit WARNs during `mise up`. gh stores its token
# in the OS keychain (not hosts.yml), so the default gh_cli_tokens discovery
# finds nothing — ask gh directly instead (authenticated = 5000 req/h).
# If gh is missing or logged out, mise debug-logs and falls back to
# unauthenticated requests, so this is harmless on machines without gh.
credential_command = "gh auth token"

[settings.npm]
# Install npm: tools with bun instead of mise's embedded `aube` (the `auto`
# default). aube's virtual-store layout defeats claude-code's postinstall:
# the 263 MB native binary is never unpacked, `bin/claude.exe` stays a
# 500-byte stub, and the shim then runs `node claude.exe` ->
# ERR_UNKNOWN_FILE_EXTENSION. Nothing surfaces it — `claude` keeps working
# only because a stray npm-global copy shadows it on PATH, so
# `just prune-rogue-npm-globals` becomes the thing that breaks it.
# bun unpacks the binary correctly and is the sanctioned Node package
# manager here anyway (ADR 0027). See ADR 0036.
package_manager = "bun"

[settings.python]
# Auto-source uv-managed `.venv` when entering a Python project. uv is
# the project-wide Python package manager per CLAUDE.md global rules.
uv_venv_auto = "source"

[settings.node]
# Auto-install corepack shims so pnpm/yarn delivered via corepack work
# out of the box (ADR 0017 — pnpm is corepack-only).
corepack = true
