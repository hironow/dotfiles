# Local telemetry: one upstream grafana/otel-lgtm container (ADR 0072).
# It bundles the OpenTelemetry Collector, Prometheus, Tempo, Loki, Pyroscope
# and Grafana with upstream defaults; dotfiles keeps no config of its own.
# Dependabot bumps the tag after a 7-day cooldown (.github/dependabot.yaml).
services:
  lgtm:
    image: docker.io/grafana/otel-lgtm:0.39.0
    ports:
      - "127.0.0.1:3000:3000"   # Grafana
      - "127.0.0.1:3200:3200"   # Tempo HTTP API
      - "127.0.0.1:4040:4040"   # Pyroscope
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
      - "127.0.0.1:9090:9090"   # Prometheus
    volumes:
      - lgtm-data:/data
    # The image's own HEALTHCHECK, restated: Podman can drop it from the image,
    # and the isolated test run waits for "healthy".
    healthcheck:
      test: ["CMD", "/otel-lgtm/docker/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  lgtm-data:

networks:
  default:
    name: shared-otel-net
    external: true
