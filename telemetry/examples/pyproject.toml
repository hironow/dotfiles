[project]
name = "opentelemetry-example"
version = "0.1.0"
description = "FastAPI application with OpenTelemetry instrumentation"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-exporter-otlp",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-httpx",
    "httpx",
]

[tool.uv]
# 7-day release quarantine, the same as every uv project in this repo.
exclude-newer = "7 days"
# The 2026-10-26 certifi cutoff (2026.10.19, the eMudhra CA removal, uploaded
# 2026-10-20T02:24Z) was dropped on 2026-10-30: that release is now older than
# the 7-day window, so the relative span admits it on its own.
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
