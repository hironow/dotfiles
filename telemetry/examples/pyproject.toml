[project]
name = "opentelemetry-example"
version = "0.1.0"
description = "FastAPI application with OpenTelemetry instrumentation"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "opentelemetry-api",
    "opentelemetry-sdk",
    "opentelemetry-instrumentation-fastapi",
    "opentelemetry-instrumentation-logging",
    "opentelemetry-exporter-otlp",
    "opentelemetry-exporter-otlp-proto-grpc",
    "opentelemetry-instrumentation-httpx",
    "httpx",
]

[tool.uv]
# 7-day release quarantine, the same as every uv project in this repo.
exclude-newer = "7 days"
# Security fix inside the window (2026-10-26), cutoff just after its upload;
# remove on or after 2026-10-28 (scripts/check_uv_exclude_newer.py fails then):
# certifi 2026.10.19 (eMudhra CA removal, uploaded 2026-10-20T02:24Z).
exclude-newer-package = { certifi = "2026-10-20T02:25:00Z" }
dev-dependencies = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
]
