# prek (j178/prek) — Rust reimplementation of pre-commit
# Install: just install-hooks  (== mise exec -- prek install)
# Run:     just pre-commit     (== mise exec -- prek run --all-files)
# Push gate (also runs pre-push stage hooks):
#          just check-all      (== prek run --all-files + just check + just test)
minimum_prek_version: "0.3.0"

# `prek install` with no --hook-type installs exactly these shims. The guard
# below only works if the commit-msg shim exists, and the historical default
# ([pre-commit]) silently left it out -- a commit message could carry a
# forbidden token past a fully "installed" hook set. `just install-hooks` also
# passes both types explicitly, so a bare `prek install` and the recipe agree.
#
# pre-push is deliberately NOT in this list: .git/hooks/pre-push in this clone
# belongs to git-lfs, and `just check-all` is the documented push gate.
default_install_hook_types: [pre-commit, commit-msg]

exclude: |
  (?x)^(
    emulator/|
    gcloud/|
    guardrails/|
    knowledge-work-plugins/|
    protocols/|
    skills/|
    telemetry/|
    /private/|
    output/|
    node_modules/|
    \.venv/|
    tools/rttm/\.venv/|
    docs/changelogs\.md
  )

repos:
  # ======================================================================
  # Confidentiality guard — runs FIRST, before anything rewrites a file.
  #
  # This repo is PUBLIC. A locally-declared token list (outside the repo, at
  # ~/.config/dotfiles/forbidden-tokens, mode 0600) names the strings that must
  # never be published; the checker scans the ADDED lines of the staged diff,
  # the staged pathnames and the commit message about to be recorded, and
  # refuses unreviewable blobs (*.tfplan / *.tfstate* / terraform.tfvars /
  # backend.hcl / .terraform/ / anything git calls binary) outright.
  #
  # Invoked as bare `python3`, not through a just recipe or `uv run`: the
  # script is stdlib-only, and `uv run` inside a commit hook can regenerate the
  # root uv.lock mid-commit (a known trap here). No local list => no-op.
  # ======================================================================
  - repo: local
    hooks:
      - id: forbidden-tokens-staged
        name: forbidden tokens (staged diff + unreviewable blobs)
        entry: python3 scripts/check_forbidden_tokens.py staged
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        description: Refuse staged content, paths or blobs that leak a private identifier.

      - id: forbidden-tokens-commit-msg
        name: forbidden tokens (commit message)
        entry: python3 scripts/check_forbidden_tokens.py commit-msg
        language: system
        stages: [commit-msg]
        description: Refuse a commit message that leaks a private identifier.

  # Rust-native builtin hooks (fast, no external repo clone needed)
  - repo: builtin
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # devcontainer.json is JSONC (comments allowed); strict JSON parse fails.
        exclude: '^\.devcontainer/devcontainer\.json$'
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  # Local hooks delegate to just recipes so the same checks run from
  # the CLI (`just fmt`, `just lint`, `just check`) and from prek.
  - repo: local
    hooks:
      - id: just-fmt
        name: just fmt
        entry: just fmt
        language: system
        pass_filenames: false
        files: '\.(py|sh|md|yaml|toml|json|html)$'
        description: Auto-format Python (ruff) and other files (prettier).

      - id: just-lint
        name: just lint
        entry: just lint
        language: system
        pass_filenames: false
        files: '\.(py|sh|md|yaml|toml|json|html)$'
        description: Lint Python (ruff --fix), shell (shellcheck), prettier --check.

  # ======================================================================
  # pre-push hooks (slower checks, run only on git push)
  # ======================================================================

  - repo: local
    hooks:
      - id: just-check
        name: just check (strict, no writes)
        entry: just check
        language: system
        pass_filenames: false
        stages: [pre-push]
        description: Strict gate — ruff format --check, ruff check, shellcheck, prettier --check, meta-semgrep.

      - id: just-test
        name: just test (sandbox + pytest)
        entry: just test
        language: system
        pass_filenames: false
        stages: [pre-push]
        description: Build the Docker sandbox image and run the sandbox test suite.

      - id: just-test-iac
        name: just test-iac (OpenTofu native tests)
        entry: just test-iac
        language: system
        pass_filenames: false
        stages: [pre-push]
        # ADR 0024 (runops-gateway repo): tofu test owns the variable
        # default + validation contract for the Coder workspace template.
        # Trigger only on Coder template HCL files so a docs-only push
        # does not pay the tofu init+test cost.
        files: '^exe/coder/templates/dotfiles-devcontainer/.*\.(tf|tofutest\.hcl)$'
        description: Run `tofu test` against the Coder workspace template (exe/coder/templates/dotfiles-devcontainer/).
