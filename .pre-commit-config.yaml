# prek (j178/prek) — Rust reimplementation of pre-commit
# Install: just install-hooks  (== mise exec -- prek install)
# Run:     just pre-commit     (== mise exec -- prek run --all-files)
# Manual push gate (not a git hook):
#          just check-all      (== prek run --all-files + just ci-all)
#
# ADRs 0083/0084: nine read-only guards; no whole-project or rewriting hooks.
# Run fmt/lint explicitly and review their diff before staging. CI retains
# fmt/lint/check/test coverage through the disposable sandbox tests. The fast
# version-consistency recipe is the only recipe retained at commit time.
minimum_prek_version: "0.3.0"

# `prek install` with no --hook-type installs exactly these shims. The guard
# below only works if the commit-msg shim exists, and the historical default
# ([pre-commit]) silently left it out -- a commit message could carry a
# forbidden token past a fully "installed" hook set. `just install-hooks` also
# passes both types explicitly, so a bare `prek install` and the recipe agree.
#
# pre-push is deliberately NOT in this list: .git/hooks/pre-push in this clone
# belongs to git-lfs, and `just check-all` is the documented push gate.
default_install_hook_types: [pre-commit, commit-msg]

exclude: |
  (?x)^(
    emulator/|
    gcloud/|
    guardrails/|
    knowledge-work-plugins/|
    protocols/|
    skills/|
    /private/|
    output/|
    node_modules/|
    \.venv/|
    tools/rttm/\.venv/|
    docs/changelogs\.md
  )

repos:
  # ======================================================================
  # Confidentiality guard — runs FIRST, ahead of every other hook.
  #
  # This repo is PUBLIC. A locally-declared token list (outside the repo, at
  # ~/.config/dotfiles/forbidden-tokens, mode 0600) names the strings that must
  # never be published; the checker scans the ADDED lines of the staged diff,
  # the staged pathnames and the commit message about to be recorded, and
  # refuses unreviewable blobs (*.tfplan / *.tfstate* / terraform.tfvars /
  # backend.hcl / .terraform/ / anything git calls binary) outright.
  #
  # Invoked as bare `python3`, not through a just recipe or `uv run`: the
  # script is stdlib-only, and `uv run` inside a commit hook can regenerate the
  # root uv.lock mid-commit (a known trap here). Both hooks pass the same
  # fail-closed gate `just ci` uses (--require-list --min-tokens 11, mirroring
  # FORBIDDEN_TOKEN_GATE in the justfile): a missing, empty or truncated list
  # FAILS the commit instead of skipping the scan. A bare invocation without
  # the flags still skips when no list is present.
  # ======================================================================
  - repo: local
    hooks:
      - id: forbidden-tokens-staged
        name: forbidden tokens (staged diff + unreviewable blobs)
        entry: python3 scripts/check_forbidden_tokens.py staged --require-list --min-tokens 11
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        description: Refuse staged content, paths or blobs that leak a private identifier.

      - id: forbidden-tokens-commit-msg
        name: forbidden tokens (commit message)
        entry: python3 scripts/check_forbidden_tokens.py commit-msg --require-list --min-tokens 11
        language: system
        stages: [commit-msg]
        description: Refuse a commit message that leaks a private identifier.

  # Rust-native builtin hooks (fast and read-only). Whitespace/EOF detection
  # moves to the Go hygiene leg of `just check` (ADR 0084), which preserves
  # site/vendor's byte exclusion and SHA-256 checks (ADR 0076).
  - repo: builtin
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
        # devcontainer.json and .oxlintrc.json are JSONC (comments allowed);
        # strict JSON parse fails. oxlint parses its own config: `just js-lint`
        # fails on a malformed one.
        exclude: '^(\.devcontainer/devcontainer\.json|\.oxlintrc\.json)$'
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  # ADR 0060's commit-time drift check stays as a designed fast subset,
  # explicitly retained by ADR 0083. Always run: changes to either input,
  # either generated install script, or the generator itself are covered.
  - repo: local
    hooks:
      - id: mise-versions-check
        name: frozen image tool versions (check only)
        entry: just mise-versions-check
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
        description: Check the frozen version source and generated files without rewriting them.

  # No rewriting hooks, whole-project recipes or pre-push hooks (ADR 0084).
  # fmt/lint/check/test remain explicit commands; check-all is the manual gate.
