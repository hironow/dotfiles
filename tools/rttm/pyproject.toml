[project]
name = "rttm"
version = "0.1.0"
description = "RTTM file tool"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "pympi-ling>=1.71",
    "ruff>=0.16.1",
    "pytest>=9.1.1",
]

[tool.uv]
# 7-day release quarantine, the same as every uv project in this repo.
exclude-newer = "7 days"
