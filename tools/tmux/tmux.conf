# ==========================================
# Core Settings
# ==========================================

# Prefix: Ctrl-q (Ctrl-b is hard to reach)
set -g prefix C-q
unbind C-b

# Mouse: click panes, drag borders, scroll
set -g mouse on

# Scrollback buffer
set -g history-limit 50000

# TrueColor support (Ghostty / iTerm2 / modern terminals)
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Extended keys (modifyOtherKeys). With no `extended-keys` line (the unset
# default is `off`) tmux recognises the sequence the terminal sends for
# Ctrl+Enter but drops it: on tmux 3.4 the pane got no bytes at all, not a CR
# (measured with a PTY playing the terminal), so Ghostty's ctrl+enter keybind
# was dead inside tmux. `always` forwards the key whether or not the
# application asked for extended keys; the pane then gets the extended form --
# ESC [13;5u on tmux 3.4, and on 3.5+ the `extended-keys-format` default
# (`xterm`) is expected to make it ESC [27;5;13~ -- which is why `.zshrc` binds
# both spellings. Keys that already have a standard form (ESC b/f, ESC [1;5D)
# are unchanged. Needs tmux >= 3.2a: on older tmux this is one warning line and
# the rest of the file still loads (tmux(1) "shows any error messages ... and
# continues"), so the only loss is Ctrl+Enter inside tmux. Do not add
# `xterm-keys`: it has defaulted to on since tmux 2.4.
set -s extended-keys always
# tmux asks the outer terminal for extended keys only when it knows they are
# supported; this is the tmux wiki's Modifier-Keys line. Terminals that ignore
# the request are unaffected (tmux recognises extended keys regardless).
set -as terminal-features 'xterm*:extkeys'

# Window/pane numbering starts at 1 (matches keyboard layout)
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# ==========================================
# Window Navigation ( [ / ] )
# ==========================================

# Prefix + [ : previous window
# Prefix + ] : next window
bind [ previous-window
bind ] next-window

# ==========================================
# Pane Management
# ==========================================

# Split: | horizontal, - vertical (keeps current path)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Move between panes with arrow keys
bind Left  select-pane -L
bind Right select-pane -R
bind Up    select-pane -U
bind Down  select-pane -D

# ==========================================
# Utility
# ==========================================

# Reload config
bind r source-file ~/.tmux.conf \; display "Config Reloaded!"

# ==========================================
# Status Bar
# ==========================================

set -g status-style bg=default,fg=white
set -g status-left "#[fg=green][#S] "
set -g status-right "#[fg=cyan]%Y-%m-%d %H:%M "

# ==========================================
# Plugin: tmux-resurrect
# ==========================================
# Save:    Prefix + Ctrl-s
# Restore: Prefix + Ctrl-r
run-shell ~/dotfiles/tools/tmux/plugins/tmux-resurrect/resurrect.tmux
