name: Check

# `just check` is the full lint gate: check-except-go, go-lint, go-test. It used
# to run on pull requests only inside the dev container job; that job now runs
# on main (test-just.yaml, ADR-0089). These jobs run the three parts in
# parallel, without a container, on every ready pull request and on main. The
# gate `check` keeps the name the single job had.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check-except-go:
    name: just check-except-go
    # Draft pull requests do not run CI; runs start when the PR is marked
    # ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    # The job took 114 s and 144 s on 2026-11-22 (ty per OS and the GC
    # simulation with its 183 tests are most of it); about twice that.
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the frozen tool set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .devcontainer/ci-bootstrap.sh --tools-only
      - name: Run just check-except-go
        run: just check-except-go

  go-lint:
    name: just go-lint (golangci-lint per GOOS)
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    # The job took 287 s and 295 s on 2026-11-22 (a cold Go build cache in
    # its own job); about twice that.
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the frozen tool set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .devcontainer/ci-bootstrap.sh --tools-only
      # Go's build cache, the module cache and golangci-lint's cache, seeded
      # from main (docs/agents/ci-speed.md): pull requests restore main's
      # entry and write none. Every cache here is content-addressed, so an
      # older entry found by the restore key is safe.
      - name: Point the Go caches at the runner's temp directory
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "GOMODCACHE=$RUNNER_TEMP/go-mod"
            echo "GOLANGCI_LINT_CACHE=$RUNNER_TEMP/golangci-lint"
          } >> "$GITHUB_ENV"
      - name: Restore main's Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
            ${{ runner.temp }}/golangci-lint
          key: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/mise/image-tools.toml', '.golangci.yaml', '**/go.sum') }}
          restore-keys: go-lint-${{ runner.os }}-${{ runner.arch }}-
      - name: Run just go-lint
        run: just go-lint
      - name: Save the Go cache (main only)
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
            ${{ runner.temp }}/golangci-lint
          key: go-lint-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/mise/image-tools.toml', '.golangci.yaml', '**/go.sum') }}

  go-test:
    name: just go-test
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    # The job took 109 s and 167 s on 2026-11-22 (a cold Go build cache in
    # its own job); about twice that.
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the frozen tool set
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .devcontainer/ci-bootstrap.sh --tools-only
      # Go's build cache, the module cache and golangci-lint's cache, seeded
      # from main (docs/agents/ci-speed.md): pull requests restore main's
      # entry and write none. Every cache here is content-addressed, so an
      # older entry found by the restore key is safe.
      - name: Point the Go caches at the runner's temp directory
        run: |
          {
            echo "GOCACHE=$RUNNER_TEMP/go-build"
            echo "GOMODCACHE=$RUNNER_TEMP/go-mod"
            echo "GOFLAGS=-count=1"
          } >> "$GITHUB_ENV"
      - name: Restore main's Go cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/mise/image-tools.toml', '**/go.sum') }}
          restore-keys: go-test-${{ runner.os }}-${{ runner.arch }}-
      - name: Run just go-test
        run: just go-test
      - name: Save the Go cache (main only)
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/go-build
            ${{ runner.temp }}/go-mod
          key: go-test-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('config/mise/image-tools.toml', '**/go.sum') }}

  check:
    name: just check (no container)
    needs: [check-except-go, go-lint, go-test]
    # always(): a skipped or failed part must fail this job, not skip it. A draft pull request skips the parts, and then this job skips too.
    if: ${{ always() && (github.event_name != 'pull_request' || github.event.pull_request.draft == false) }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every part of just check passed
        env:
          RESULTS: ${{ needs.check-except-go.result }} ${{ needs.go-lint.result }} ${{ needs.go-test.result }}
        run: |
          echo "results: $RESULTS"
          [ "$RESULTS" = "success success success" ]
