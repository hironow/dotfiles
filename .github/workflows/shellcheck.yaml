name: Shellcheck Linting

# Restrict push to main so feature branch pushes do not trigger
# extra runs (= pull_request covers PR review、 既存
# iac-test.yaml / test-just.yaml と同 pattern)。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is not in the default event set; without it a draft
    # marked ready would not get a run until its next push.
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  lint:
    # Draft pull requests do not run CI; runs start when the PR is marked
    # ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # shellcheck は ubuntu-latest ランナーにプリインストール済み。
      # CI は mise 非依存 (mise.toml はローカル開発用)。
      - run: shellcheck *.sh
