name: Unit Tests

# Host-side unit gate: agent hook guards (tests/unit/), the plugin
# check-scope drift gate, the marketplace manifest pins, and the
# always-loaded instruction budget. `just ci` runs the same gate locally;
# before this workflow GitHub only ran shellcheck / devcontainer sandbox /
# IaC, so tests/unit/ never gated a PR (e.g. editing one check-scope copy
# directly would have passed CI).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is not in the default event set; without it a draft
    # marked ready would not get a run until its next push.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests + instruction budget
    # Draft pull requests do not run CI; runs start when the PR is marked
    # ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # CI は mise 非依存 (mise.toml はローカル開発用)。uv は公式
      # インストーラで導入。just は recipe-propagation テスト
      # (tests/unit/test_plugin_check_scope.py) が実行する — ubuntu の
      # apt パッケージは 1.21 で `[group]` attribute (1.27+) を parse
      # できないため、uv tool で最新を ~/.local/bin に入れる。
      # jq / bash はランナーにプリインストール済み。
      - name: Install uv and just
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install rust-just

      - name: Run unit tests
        run: uvx pytest -q -ra tests/unit/

      # The command guard corpus, its word table, and the agent-hook payload
      # and tool-hooks corpora follow Python 3.14 (Unicode 16.0). The system
      # Python above skips the checks that need it; this step makes them on
      # 3.14, where a skip fails instead.
      - name: Command guard, payload, and tool-hooks corpora on Python 3.14
        env:
          COMMAND_GUARD_CORPUS_STRICT: "1"
        run: >-
          uvx --python 3.14 pytest -q -ra
          tests/unit/test_command_guard_corpus.py
          tests/unit/test_hook_payload_corpus.py
          tests/unit/test_tool_hooks_corpus.py

      # Doctor's real-hookrelease test and the installed-release recipe's test
      # need the Go that tools/agent-hooks/go.mod asks for. The runner's system
      # Go is older, so the run above skips them; this step gives them that Go,
      # and a skip fails instead.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/agent-hooks/go.mod
          cache-dependency-path: tools/agent-hooks/go.sum
      - name: Agent-hook's real Go tests, with the module's Go
        env:
          AGENT_HOOKS_STRICT_GO: "1"
        run: >-
          uvx pytest -q -ra
          tests/unit/test_agent_hook_doctor.py::test_real_hookrelease_rebuilds_a_real_temporary_release
          tests/unit/test_agent_hooks_test_installed.py

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check Pi provider failover
        run: bun test tests/unit/jev_sonnet_fallback.test.ts

      # Keep --max in sync with the `instruction-budget` recipe in the
      # justfile (the recipe is not callable here because the justfile
      # wraps tools with `mise exec`).
      - name: Instruction budget
        # --frozen: install from the committed root uv.lock, never rewrite it.
        run: uv run --frozen scripts/instruction_budget.py --max 40 ROOT_AGENTS.md ROOT_CLAUDE.md

  go:
    name: Go tests (tools/)
    # The Go modules under tools/, the agent-hook binary's parity and
    # conformance tests among them. The dev container job also runs them
    # through `just check` (test-just.yaml); this job gives fast, independent
    # feedback.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      # Every tools/ module asks for Go 1.27.3 or older; agent-hooks names it.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/agent-hooks/go.mod
          cache-dependency-path: tools/*/go.sum
      # The jobs share nothing, and the runner image has no just.
      - name: Install uv and just
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install rust-just
      - name: Go tests
        # setup-go writes GOTOOLCHAIN=local for the steps after it; auto lets a
        # module that asks for a newer Go fetch it.
        env:
          GOTOOLCHAIN: auto
        run: just go-test go
      - name: Vet agent-hook for Windows and for other Unix systems
        # No job runs agent-hook on these: Windows has code of its own, and on
        # other Unix systems (freebsd stands for them) the process adapter
        # refuses commands. Vet keeps both compiling.
        working-directory: tools/agent-hooks
        run: |
          GOOS=windows go vet ./...
          GOOS=freebsd go vet ./internal/launch/
  go-macos:
    name: Go tests on macOS (agent-hook file log)
    # The agent-hook file log removes macOS ACLs through raw system calls
    # (tools/agent-hooks/internal/logsink/acl_darwin.go). That code builds
    # and runs only on macOS, and the go job above runs on Linux.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: tools/agent-hooks/go.mod
          cache-dependency-path: tools/agent-hooks/go.sum
      - name: Vet the module and test the file log
        working-directory: tools/agent-hooks
        run: |
          go vet ./...
          go test -count=1 ./internal/logsink/
  windows-jev:
    name: Jev launcher + just HOME on PowerShell
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install just
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          uv tool install rust-just
          (uv tool dir --bin) | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check PowerShell launchers and HOME-less justfile
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          just --summary
          uvx pytest -q tests/unit/test_jev_launch.py tests/unit/test_jev_core.py tests/unit/test_jev_claude_hook.py tests/unit/test_jev_claude_verify.py tests/unit/test_jev_pi_verify.py tests/unit/test_jev_codex_exec.py tests/unit/test_install_pi_extensions.py tests/unit/test_justfile_home.py tests/unit/test_jev_powershell.py tests/unit/test_agent_hooks_build_recipe.py
          bun test tests/unit/jev_sonnet_fallback.test.ts

  # The Ollama host checks run Windows PowerShell classifiers (the WSL
  # forwarder, the declared tailnet forward) that only a Windows runner can
  # execute; on ubuntu-latest those tests skip.
  windows-ollama-host:
    name: Ollama host checks on Windows PowerShell
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Run the Ollama host tests
        shell: pwsh
        run: uvx pytest -q -ra tests/unit/test_ollama_host.py
