name: Unit Tests

# Host-side unit gate: agent hook guards (tests/unit/), the plugin
# check-scope drift gate, the marketplace manifest pins, and the
# always-loaded instruction budget. `just ci` runs the same gate locally;
# before this workflow GitHub only ran shellcheck / devcontainer sandbox /
# IaC, so tests/unit/ never gated a PR (e.g. editing one check-scope copy
# directly would have passed CI).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is not in the default event set; without it a draft
    # marked ready would not get a run until its next push.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: unit tests + instruction budget
    # Draft pull requests do not run CI; runs start when the PR is marked
    # ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # ADR 0028: assert every uv project routes through the flatt PyPI mirror
      # and no committed lock falls back to raw pypi.org. Pure grep (no uv /
      # network), so it runs before the uv install and fails fast.
      - name: Check uv flatt index (ADR 0028)
        run: bash scripts/check_uv_flatt_index.sh

      # CI は mise 非依存 (mise.toml はローカル開発用)。uv は公式
      # インストーラで導入。just は recipe-propagation テスト
      # (tests/unit/test_plugin_check_scope.py) が実行する — ubuntu の
      # apt パッケージは 1.21 で `[group]` attribute (1.27+) を parse
      # できないため、uv tool で最新を ~/.local/bin に入れる。
      # jq / bash はランナーにプリインストール済み。
      - name: Install uv and just
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install rust-just

      - name: Run unit tests
        run: uvx pytest -q -ra tests/unit/

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check Pi provider failover
        run: bun test tests/unit/jev_sonnet_fallback.test.ts

      # Keep --max in sync with the `instruction-budget` recipe in the
      # justfile (the recipe is not callable here because the justfile
      # wraps tools with `mise exec`).
      - name: Instruction budget
        # --frozen: install from the committed root uv.lock, never rewrite it.
        run: uv run --frozen scripts/instruction_budget.py --max 40 ROOT_AGENTS.md ROOT_CLAUDE.md

  windows-jev:
    name: Jev launcher + just HOME on PowerShell
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
      - name: Install just
        run: |
          uv tool install rust-just
          (uv tool dir --bin) | Out-File -FilePath $env:GITHUB_PATH -Append
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Check PowerShell launchers and HOME-less justfile
        shell: pwsh
        run: |
          Remove-Item Env:HOME -ErrorAction SilentlyContinue
          just --evaluate _EXE_SRC_DIR
          uvx pytest -q tests/unit/test_jev_launch.py tests/unit/test_install_pi_extensions.py tests/unit/test_justfile_home.py tests/unit/test_jev_powershell.py
          bun test tests/unit/jev_sonnet_fallback.test.ts
