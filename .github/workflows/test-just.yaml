name: Just Sandbox Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Required disposable Podman devcontainer build/up/exec
    # Draft pull requests do not run CI; runs start when the PR is marked
    # ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DOTFILES_DEVCONTAINER_MANIFEST: ${{ github.workspace }}/devcontainer-run.json
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bootstrap native Podman and canonical frozen CLI tools
        run: bash .devcontainer/ci-bootstrap.sh
      - name: Run required disposable devcontainer acceptance and sandbox tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tests make tracked-only snapshots, not a real repository bind.
          # DOTFILES_SANDBOX_DISPOSABLE_CHECKOUT=1 is set ONLY inside that snapshot.
          export PYTEST_ADDOPTS="--junitxml=${GITHUB_WORKSPACE}/pytest-report.xml"
          just test
      - name: Always clean only journal-owned devcontainer resources
        if: always()
        run: |
          if [ -f "$DOTFILES_DEVCONTAINER_MANIFEST" ]; then
            uv run --frozen --group dev python tests/test_just_sandbox.py \
              --cleanup-manifest "$DOTFILES_DEVCONTAINER_MANIFEST"
          fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pytest-report
          path: ${{ github.workspace }}/pytest-report.xml
