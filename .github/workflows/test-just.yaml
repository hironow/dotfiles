name: Just Sandbox Tests

# On main, on demand, and on the ready pull requests that change anything
# outside `paths-ignore` (ADR-0089). Every reader of an ignored directory is a
# leg of `just check`, which check.yaml runs on every pull request with the
# image's pinned tools; this job adds the image build and the recipes that run
# only in the container. Not a required check: on most pull requests it skips.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - 'docs/**/*.md'
      - 'emulator/**'
      - 'telemetry/**'
      - 'site/**'
      - 'tofu/**'
      - 'tests/unit/**'
      - 'tests/durations/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Required disposable Podman devcontainer build/up/exec
    # Draft pull requests do not run CI; runs start when the PR is marked
    # ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      DOTFILES_DEVCONTAINER_MANIFEST: ${{ github.workspace }}/devcontainer-run.json
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Bootstrap native Podman and canonical frozen CLI tools
        env:
          # mise and the bootstrap's own API calls; the anonymous limit is low.
          GITHUB_TOKEN: ${{ github.token }}
        run: bash .devcontainer/ci-bootstrap.sh
      - name: Run required disposable devcontainer acceptance and sandbox tests
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tests make tracked-only snapshots, not a real repository bind.
          # DOTFILES_SANDBOX_DISPOSABLE_CHECKOUT=1 is set ONLY inside that snapshot.
          export PYTEST_ADDOPTS="--junitxml=${GITHUB_WORKSPACE}/pytest-report.xml"
          just test
      - name: Always clean only journal-owned devcontainer resources
        if: always()
        run: |
          if [ -f "$DOTFILES_DEVCONTAINER_MANIFEST" ]; then
            uv run --frozen --group dev python tests/test_just_sandbox.py \
              --cleanup-manifest "$DOTFILES_DEVCONTAINER_MANIFEST"
          fi
      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-report
          path: ${{ github.workspace }}/pytest-report.xml
