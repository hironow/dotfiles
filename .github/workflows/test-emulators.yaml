name: Test Emulators

on:
  push:
    branches: [main]
    paths:
      - 'emulator/**'
      - '!emulator/**/*.md'
      - '!emulator/**/*.MD'
      - '.devcontainer/ci-bootstrap.sh'
      - '.devcontainer/allow-podman-stop-pasta.sh'
      - '.github/workflows/test-emulators.yaml'
  pull_request:
    branches: [main]
    paths:
      - 'emulator/**'
      - '!emulator/**/*.md'
      - '!emulator/**/*.MD'
      - '.devcontainer/ci-bootstrap.sh'
      - '.devcontainer/allow-podman-stop-pasta.sh'
      - '.github/workflows/test-emulators.yaml'
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-test-emulators
  cancel-in-progress: true

jobs:
  unit-integration-e2e:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: emulator
    env:
      PODMAN_COMPOSE_PROVIDER: podman-compose
      DOTFILES_E2E_REQUIRED: '1'
      DOTFILES_PODMAN_RUN_MANIFEST: ${{ github.workspace }}/podman-run.json
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Bootstrap same-user native Podman and canonical frozen CLI tools
        working-directory: ${{ github.workspace }}
        env:
          # mise and the bootstrap's own API calls; the anonymous limit is low.
          GITHUB_TOKEN: ${{ github.token }}
          # temporary: request log for the PR's evidence
          MISE_LOG_HTTP: '1'
          MISE_VERBOSE: '1'
        run: bash .devcontainer/ci-bootstrap.sh
      - name: Install dependencies from the committed lock
        run: uv sync --all-extras --frozen --group lint
      - name: Lint and type-check
        run: |
          uv run --frozen --only-group lint ruff format --check .
          uv run --frozen --only-group lint ruff check .
          uv run --frozen --group lint ty check
      - name: Prepare owned tracked-only emulator and telemetry snapshot
        run: |
          uv run --frozen python -m tests.utils.isolation prepare \
            --source "$GITHUB_WORKSPACE" --manifest "$DOTFILES_PODMAN_RUN_MANIFEST" \
            --services firebase-emulator,spanner-emulator,pgadapter,postgres --telemetry
      - name: Start only this run's isolated services
        run: uv run --frozen python -m tests.utils.isolation start --manifest "$DOTFILES_PODMAN_RUN_MANIFEST"
      - name: Wait using the same run manifest
        run: uv run --frozen python -m tests.utils.isolation wait --manifest "$DOTFILES_PODMAN_RUN_MANIFEST"
      - name: Run unit and integration tests
        timeout-minutes: 5
        run: uv run --frozen pytest tests/ -v -m 'not e2e'
      - name: Run required selected-service e2e tests without Docker executable
        timeout-minutes: 20
        run: |
          set -o pipefail
          if command -v docker >/dev/null 2>&1; then
            echo 'Docker executable unexpectedly present on PATH' >&2
            exit 1
          fi
          export PYTEST_ADDOPTS="--junitxml=${GITHUB_WORKSPACE}/pytest-report.xml"
          uv run --frozen pytest tests/e2e -v -m e2e -ra | tee e2e.log
      - name: Run actual Postgres 18 feature and database tests
        run: |
          uv run --frozen pytest tests/test_postgres18_features.py tests/test_postgres18_emulator.py \
            -v --junitxml="${GITHUB_WORKSPACE}/pytest-postgres-report.xml"
      - name: Show owned-run status on failure
        if: failure()
        run: |
          if [ -f "$DOTFILES_PODMAN_RUN_MANIFEST" ]; then
            uv run --frozen python -m tests.utils.isolation status --manifest "$DOTFILES_PODMAN_RUN_MANIFEST"
          fi
      - name: Always clean only manifest-owned IDs and labels
        if: always()
        run: |
          if [ -f "$DOTFILES_PODMAN_RUN_MANIFEST" ]; then
            uv run --frozen python -m tests.utils.isolation cleanup --manifest "$DOTFILES_PODMAN_RUN_MANIFEST"
          fi
      - name: Upload host test reports and run receipt
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: emulator-podman-reports
          path: |
            ${{ github.workspace }}/pytest-report.xml
            ${{ github.workspace }}/pytest-postgres-report.xml
            ${{ github.workspace }}/podman-run.json
            ${{ github.workspace }}/emulator/e2e.log
