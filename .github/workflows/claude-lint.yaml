name: Claude Config Lint

# Gate the Claude artifacts this repo distributes (marketplace + plugins and
# the skill/agent/command/hook files they reference) with the OFFICIAL
# `claude plugin validate --strict`, run via a version-pinned bunx (nothing
# global on the runner; bun runs claude-code's postinstall because the
# package is on bun's default-trusted list — ADR 0040). The third-party
# claudelint that used to run here is retired (ADR 0041). CI never runs
# `just ci`, so without this workflow `lint-claude` would only gate locally.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  claude-lint:
    name: claude plugin validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        # Vendored submodules are not owned here and would add scan noise.
        # No submodules is the checkout default; set explicitly as documentation.
        with:
          submodules: false

      # bun is not preinstalled on ubuntu runners and the oven-sh setup action
      # is not on the allowlist, so install via the official bun.sh script.
      - name: Install bun
        run: |
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # Official validator, pinned. Before ADR 0041 the official half never
      # ran in CI at all (only the retired claudelint did).
      - name: claude plugin validate --strict (official, pinned bunx)
        run: |
          bunx @anthropic-ai/claude-code@2.1.226 plugin validate --strict .
          for m in plugins/*/.claude-plugin/plugin.json; do
            bunx @anthropic-ai/claude-code@2.1.226 plugin validate --strict "${m%/.claude-plugin/plugin.json}"
          done

      # The fragment layers ({env, settings} wrappers) are not a shape any
      # external tool understands; compose the effective settings per
      # profile x OS and validate structurally (stdlib-only — ADR 0037/0041).
      - name: effective settings (profiles x OS)
        run: python3 scripts/check_effective_settings.py
