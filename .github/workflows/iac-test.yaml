name: IaC Tests (OpenTofu)

# One IaC gate on every push and PR: `tofu test` for tofu/tailnet — an offline
# suite on mock providers, with no backend, no tfvars and no credentials.
#
# The retired Coder stack's two gates (a `tofu test` for its workspace template
# and a `tofu validate` for tofu/exe) went with the stack itself, and the exe
# stacks' suites went with theirs. tofu/tailnet is what is left here.
# ADR 0024 (in the runops-gateway repo) is the canonical rationale
# for splitting IaC tests across `tofu test` (variable defaults /
# validation) and pytest (heredoc body content, systemd-analyze).
#
# Uses opentofu/setup-opentofu rather than the devcontainer's
# MISE_OFFLINE=1 environment because pinning OpenTofu through
# mise.toml would require rebuilding the devcontainer base image
# (the ADR-0006 flow), which is out of scope for this gate. The
# action lives outside the dotfiles 'allow list' historically; the
# operator added 'opentofu/setup-opentofu@*' to the repo's actions
# allow list when this workflow first ran.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # ready_for_review is not in the default event set; without it a draft
    # marked ready would not get a run until its next push.
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-iac:
    name: tofu test (${{ matrix.stack }})
    # Draft pull requests do not run CI; runs start when the PR is marked
    # ready for review.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        stack: [tofu/tailnet]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      # Keep this equal to the host `opentofu` pin in
      # config/mise/config.toml, so this gate and `just test-iac` run the same
      # binary.
      - uses: opentofu/setup-opentofu@a1320f892987e89d278cc92dc5adc984fb93aca4 # v2.0.2
        with:
          tofu_version: 1.13.2

      # The tailscale provider is published only as a github.com release
      # asset, and that front door has returned 504s for hours. A provider
      # cache that outlives the run means only a run after a lock file change
      # downloads it. OpenTofu uses a cached provider only when it matches the
      # hashes in the stack's .terraform.lock.hcl, so a bad cache entry fails
      # the run instead of being used. `just test-iac` keeps its own cache in
      # the same place under ~/.cache.
      - name: Point OpenTofu at the provider cache
        run: |
          cache_dir="$HOME/.cache/opentofu/plugin-cache"
          mkdir -p "$cache_dir"
          echo "TF_PLUGIN_CACHE_DIR=$cache_dir" >> "$GITHUB_ENV"

      # No restore-keys: a provider bump changes the lock file and the key,
      # and an older cache would only hold versions no stack uses.
      - name: Restore the provider cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tofu-providers-${{ runner.os }}-${{ hashFiles('tofu/**/.terraform.lock.hcl') }}

      # Offline: mock providers, no backend, no tfvars and no credentials, so
      # the suite never reaches a real tailnet. Mirrors `just test-iac`, which
      # discovers its stacks from the tracked `*.tofutest.hcl` files rather
      # than listing them, so the two cannot drift apart by one being edited.
      - name: tofu test
        working-directory: ${{ matrix.stack }}
        run: |
          tofu init -backend=false -input=false
          tofu test
