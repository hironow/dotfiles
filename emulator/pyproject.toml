[project]
name = "emulator-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
# Capped below 3.14: litellm went from a pure-python wheel (1.91.0, py3) to
# Rust extension wheels (1.92.0, cp310-cp313 only). With no cp314 wheel, uv
# falls back to the sdist, whose maturin/pyo3 build refuses 3.14 outright
# ("the configured Python interpreter version (3.14) is newer than PyO3's
# maximum supported version"). litellm itself declares requires-python <3.14.
# Lift once litellm ships cp314 wheels (and bump test-emulators.yaml back).
requires-python = ">=3.13,<3.14"
dependencies = [
    "asyncpg>=0.30.0",
    "aiohttp>=3.14.3",
    "litellm>=1.96.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.2",
    "typer>=0.27.1",
    "uvicorn>=0.52.1",
]

[dependency-groups]
dev = [
    "docker>=7.2.0",
    # Only tests/e2e/test_mlflow_e2e.py imports the mlflow client; the tracking
    # server itself runs from the compose image (mlflow service).
    "mlflow>=3.15.1",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-timeout>=2.3.1",
    # == the dotfiles gate pin (`uvx ruff@<ver>` in the root justfile); a newer
    # ruff widens the default rules. tests/unit/test_ruff_ty_pins.py keeps it equal.
    "ruff==0.15.22",
    "ty==0.0.77",
]

# ty (ADR 0044): type-check the emulator tooling; warnings fail `just emu-lint`.
[tool.ty.terminal]
error-on-warning = true

# ruff (ADR 0044): the canonical rule set from docs/agents/python-tooling.md.
# tests/** are exempt from ANN (every def annotated) and PLR2004 (magic-value
# comparison): an `assert status == 200` needs neither a named constant nor an
# annotated fixture signature, and 284 of the 331 findings the canonical set
# raised here were exactly that (2026-09-08). PLR0911 / PLR0915 (return and
# statement counts) are complexity heuristics for production code; an e2e
# scenario or a per-type conversion helper in a test is long by nature.
# Non-test code keeps every rule.
[tool.ruff.lint]
select = [
    "FAST", # FastAPI
    "C90",  # mccabe
    "NPY",  # numpy
    "PD",   # pandas
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "DTZ",  # flake8-datetimez
    "T20",  # flake8-print
    "N",    # pep8-naming
    "I",    # isort
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "PLE",  # Pylint errors
    "PLR",  # Pylint refactor
    "UP",   # pyupgrade
    "FURB", # refurb
    "RUF",  # Ruff-specific rules
    "ANN",  # flake8-annotations
]
extend-ignore = ["E501", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ANN", "PLR2004", "PLR0911", "PLR0915"]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that require Docker and running emulators",
]
# Default timeout for all tests (can be overridden per test)
timeout = 180
# Timeout method: 'thread' is more compatible with async tests
timeout_method = "thread"

[tool.uv]
# Supply-chain quarantine: only resolve distributions that have been public for
# at least 7 days. This is repo-authoritative (not just a personal global uv
# config), so EVERY `uv lock` -- local, CI, and Dependabot's uv updater --
# reproduces `exclude-newer-span = "P7D"` in uv.lock instead of silently
# dropping it. Mirrors the npm `min-release-age=7` quarantine. uv serializes the
# relative "7 days" value to the lock's `exclude-newer-span = "P7D"`.
# Security fixes that need a <7-day-old release are let through PER PACKAGE
# with `exclude-newer-package` below: an absolute cutoff just after that
# release's upload time, which uv serializes to `[options.exclude-newer-package]`
# in the lock while the global P7D stays intact. Do NOT use the one-shot
# `uv lock --upgrade-package <pkg> --exclude-newer "$(date -u +%FT%TZ)"`: since
# uv 0.12 a following plain `uv lock` re-resolves ("addition of exclude newer
# span") and silently downgrades the package back into quarantine (verified
# 2026-09-08, uv 0.12.10). Drop an entry once its release is >=7 days old.
exclude-newer = "7 days"
# mlflow 3.16.0 (uploaded 2026-09-04) lifts the `cryptography<50` cap so that
# cryptography 50.0.1 (GHSA-g6cj-pr64-35w5, Dependabot #103) can resolve.
# Removable after 2026-09-11 -- `just check-uv-exclude-newer` (in `just check`)
# fails from then on until the entry is deleted and `uv lock` re-run.
exclude-newer-package = { mlflow = "2026-09-04T06:00:00Z", mlflow-skinny = "2026-09-04T06:00:00Z", mlflow-tracing = "2026-09-04T06:00:00Z" }

# ADR 0028: route resolution through the Flatt Security PyPI mirror (malware-
# scanned). flatt becomes the default index, replacing the implicit pypi.org.
# Public, no-auth endpoint -- no secret distribution. The invariant (enforced by
# `just check-uv-flatt-index`) is the ABSENCE of raw pypi.org in the committed
# lock. exclude-newer above is orthogonal and preserved (P7D stays in the lock).
[[tool.uv.index]]
name = "flatt"
url = "https://pypi.flatt.tech/simple/"
default = true
