# Cloud Build for the exe task image (docker/exe-task.Dockerfile), run by
# `just exe-image` in the private project: default pool (native amd64), the
# dedicated exe-build service account, source staged in the 7-day exe-build
# bucket, logs to Cloud Logging only (no unbounded default log bucket).
#
# The recipe stages the build context -- the Dockerfile, the ax-task-runner
# cross-compiled from the pinned ax checkout, and its bootstrap script -- and
# passes the destination as _IMAGE. `images:` pushes it; the recipe then reads
# the digest back and checks the pushed image is linux/amd64.
steps:
  - name: gcr.io/cloud-builders/docker@sha256:bbb3d633c5c2813b2ce5245852979e1d637768f4acfc504d8ece288f91e9b60f
    env:
      - DOCKER_BUILDKIT=1
    args:
      - build
      - --platform=linux/amd64
      - --tag=${_IMAGE}
      - --file=Dockerfile
      - .
images:
  - ${_IMAGE}
options:
  logging: CLOUD_LOGGING_ONLY
  substitutionOption: MUST_MATCH
timeout: 1800s
