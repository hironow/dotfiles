rules:
  - id: agentcore-testing-no-mock-in-e2e
    message: |
      Mocks, stubs, and patching are forbidden in e2e tests (any path that
      contains e2e). An e2e test uses real dependencies only; if one cannot
      be used, it is an integration test. See docs/agents/testing.md.
    severity: ERROR
    languages: [python]
    paths:
      include:
        - "*e2e*"
    patterns:
      - pattern-either:
          - pattern: unittest.mock.$ANY(...)
          - pattern: mock.$ANY(...)
          - pattern: $M.patch(...)
          - pattern: MagicMock(...)
          - pattern: Mock(...)
          - pattern: mocker.$ANY(...)
          - pattern: monkeypatch.$ANY(...)
    metadata:
      category: testing
      added: "2026-06-10"
      ref: docs/agents/testing.md
